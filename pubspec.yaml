name: geo_evidence
description: "Secure Geo-Tagged Evidence Management Prototype"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Camera (no gallery)
  camera: ^0.11.3

  # Location (Fused Location Provider)
  geolocator: ^12.0.0
  permission_handler: ^11.0.0

  # Security
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Networking
  http: ^1.2.0

  # Local Storage & Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  device_info_plus: ^10.0.0

  # State Management
  provider: ^6.1.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
