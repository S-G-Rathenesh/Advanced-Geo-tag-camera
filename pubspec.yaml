name: capturovert
description: "Secure Geo-Tagged Evidence Management Prototype"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Camera (no gallery)
  camera: ^0.12.0

  # Location (Fused Location Provider)
  geolocator: ^12.0.0
  permission_handler: ^11.0.0

  # Security
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # Networking
  http: ^1.2.0

  # Local Storage & Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  device_info_plus: ^10.0.0

  # State Management
  provider: ^6.1.0
  path: ^1.9.1
  google_mlkit_image_labeling: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo.png"
  adaptive_icon_background: "#07111A"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21 # android min sdk minVal

flutter:
  uses-material-design: true

  assets:
    - assets/
